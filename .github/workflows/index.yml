# Publish the hashed flat index (GitHub Pages) for a release's wheels. Run after build.yml.
name: index
on:
  workflow_dispatch:
    inputs:
      tag:
        description: release tag to index
        default: cp315
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: the build's recorded hashes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ inputs.tag }}" -p 'SHA256SUMS-*.txt' -D sums
          gh release download "${{ inputs.tag }}" -p '*.whl' -D wheels
      - name: write site/<tag>/index.html and site/<tag>/files/ (hash-checked copies)
        run: python3 scripts/make_index.py "${{ inputs.tag }}" sums wheels
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v5
